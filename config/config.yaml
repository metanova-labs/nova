# Number of targets and antitargets to select
protein_selection:
  small_molecule:
    target: "O15427" # if multiple targets, they should be comma separated
    clip_interval: [[1, 465]] # interval to clip sequence (0-based, exclude aas outside of this interval). If None, no clipping is done. One value for each target.
  nanobody:
    target: "Q9NZQ7" # if multiple targets, they should be comma separated
    clip_interval: [[17, 132]] # interval to clip sequence (0-based, exclude aas outside of this interval). If None, no clipping is done. One value for each target.
    structure: "8AOK" # structure to use for scoring (PDB ID)
    structure_chain: "A" # chain to use for scoring (if multiple chains in structure)
    structure_res_index: 1..115 # residue indices in structure to use for scoring
    structure_binding_site: 37,39,41..44,46,49,51,56,59,94..96,98,100,104..108 # binding site residues to use for scoring

# Competition parameters
competition:
  # No submission blocks
  no_submission_blocks: 10
  nanobody_weight: 0.4 # proportion of incentive to give to nanobody winner

# Bounty payout settings
payout:
  enabled: true
  override_uid: 42 # compound payout UID

# Molecular property requirements
molecule_requirements:
  num_molecules: 20
  min_entropy: 0.25 # minimum entropy required when num_molecules > 1
  max_similarity_to_historical: 0.5 # maximum similarity to historical submissions to be considered valid

  # molecule plausibility filters, see utils/filters.py
  filters:
    max_heavy_atoms: 50
    min_heavy_atoms: 10
    max_molecular_weight: 700
    min_molecular_weight: 100
    max_hbd: 5
    max_hba: 10
    max_logp: 5.5
    min_rotatable_bonds: 1
    max_rotatable_bonds: 10
    min_rings: 1
    max_ring_size: 7
    max_spiro_atoms: 2
    max_aromatic_rings: 5
    max_aliphatic_rings: 5
    max_fsp3: 0.8
    max_triple_bonds: 1
    max_amide_bonds: 5
    max_stereocenters: 5
    max_halogens: 6
    max_iodine: 0
    max_bromine: 0
    max_fluorine: 3
    max_phosphorus: 0
    max_nitrogen: 9
    max_oxygen: 9
    max_sulfur: 1
    max_aromatic_nitrogen: 5
    max_aromatic_carbon: 24
    max_aromatic_fraction: 0.92
    min_heteroatom_fraction: 0.05
    max_heteroatom_fraction: 0.65
    max_bertz_ct: 1950
    max_kappa1: 35
    max_kappa2: 17
    max_kappa3: 12
    max_nitrile: 1
    max_hydroxyl: 5


# Reaction filtering configuration
reaction_filtering:
  random_valid_reaction: true  # true = epoch picks allowed reactions (see rxn_group_filtering); false = only allowed_reactions below are allowed
  rxn_group_filtering: true # true = one reaction id from each rxn_groups entry per epoch; false = one reaction for the whole epoch
  rxn_groups: [[2, 3, 4, 5, 6, 11, 13, 15, 20, 23, 27, 29, 33, 44], [1, 7, 8, 9, 12, 14, 19, 21, 22, 28, 41, 42], [10, 16, 17, 18, 24, 25, 26, 30, 31, 32, 34, 35, 36, 37, 38, 39, 40, 43]] # reaction ids; together these lists cover reactions 1-44
  allowed_reactions: ["rxn:1", "rxn:2", "rxn:3", "rxn:4", "rxn:5"] # allowed reactions (only used if random_valid_reaction is false)

# Boltz2 configuration
boltz2_config:
  boltz_metric: ["affinity_probability_binary", "affinity_pred_value"] # metric to use for scoring: ["affinity_pred_value", "affinity_probability_binary", "confidence_score", ...]
  combination_strategy: "heavy_atom_normalization" # "heavy_atom_normalization" or "average"
  boltz_mode: max # "max" or "min"

# Nanobody requirements
nanobody_requirements:
  num_sequences: 1
  min_sequence_length: 90
  max_sequence_length: 150
  max_homopolymer_run: 6 # maximum length of a homopolymer run (e.g. AAAAAA)
  max_di_repeat_pairs: 4 # maximum number of di-repeat pairs (e.g."GSGSGSGSGS" has 5 pairs -> reject)
  reject_signal_peptides: true # reject sequences that look like signal peptides (strong N term hydrophobicity)
  sp_window: 12
  sp_hydro_min_in_window: 8 # >=8 hydrophobic in a 12-aa window
  sp_scan_prefix: 30 # length of N term sequence to scan for signal peptide
  max_similarity_score: 0.95 # maximum similarity score to top sequences for that target (calculated by metanano.search.search_engine)
  num_top_sequences: null # number of top sequences to consider for similarity check, if None, all top sequences are considered
  enforce_vhh_hallmarks: true # enforce VHH FR2 region hallmark residues (E/Q at pos 49, R at pos 50)
  psh_strict_rejection_threshold: 89 # strict rejection threshold for surface hydrophobic patches (less than, inclusive)
  min_human_v_identity: 82
  min_human_j_identity: 86

# Germline filtering configuration
germline_filtering:
  v_neighborhood_categories:
    V1: ["IGHV3-23"]
    V2: ["IGHV3-66"]
    V3: ["IGHV3-74"]
    V4: ["IGHV3-7", "IGHV3-11", "IGHV3-43", "IGHV3-48", "IGHV3-53", "IGHV3-64"]
  cdr3_length_range:
    min: 5
    max: 23

boltzgen_config:
  boltzgen_rank_mode: min # "max" or "min"
  boltzgen_rank_by: rank_sum # "rank_sum" or "worst_rank"
